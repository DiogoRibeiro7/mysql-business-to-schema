version: '3.8'

services:
  # MLflow Tracking Server
  mlflow-server:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: mlflow-server
    ports:
      - "5001:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://mlflow:mlflow@mlflow-postgres:5432/mlflow
      - DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    depends_on:
      - mlflow-postgres
      - minio
    volumes:
      - mlflow-data:/mlflow
    networks:
      - ml-platform
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@mlflow-postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000

  # PostgreSQL for MLflow
  mlflow-postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      - POSTGRES_DB=mlflow
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-mlflow.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    networks:
      - ml-platform

  # MinIO for Artifact Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - ml-platform

  # MinIO Client for bucket creation
  minio-client:
    image: minio/mc:latest
    container_name: minio-client
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/mlflow-artifacts;
      mc mb myminio/feature-store;
      mc mb myminio/models;
      mc mb myminio/datasets;
      mc policy set public myminio/mlflow-artifacts;
      exit 0;
      "
    networks:
      - ml-platform

  # Feast Feature Store
  feast-server:
    build:
      context: ./feast
      dockerfile: Dockerfile
    container_name: feast-server
    ports:
      - "6566:6566"
      - "8888:8888"
    environment:
      - FEAST_REDIS_HOST=redis-feast
      - FEAST_REDIS_PORT=6379
      - FEAST_POSTGRES_HOST=feast-postgres
      - FEAST_POSTGRES_PORT=5432
      - FEAST_POSTGRES_DB=feast
      - FEAST_POSTGRES_USER=feast
      - FEAST_POSTGRES_PASSWORD=feast
      - FEAST_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - feast-postgres
      - redis-feast
      - minio
    volumes:
      - ./feast/feature_repo:/app/feature_repo
      - feast-data:/feast
    networks:
      - ml-platform
    command: >
      sh -c "
      cd /app/feature_repo &&
      feast apply &&
      feast materialize-incremental $(date -u '+%Y-%m-%dT%H:%M:%S') &&
      feast serve -h 0.0.0.0 -p 6566
      "

  # PostgreSQL for Feast
  feast-postgres:
    image: postgres:15
    container_name: feast-postgres
    environment:
      - POSTGRES_DB=feast
      - POSTGRES_USER=feast
      - POSTGRES_PASSWORD=feast
    volumes:
      - feast-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-feast.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"
    networks:
      - ml-platform

  # Redis for Feast Online Store
  redis-feast:
    image: redis:7-alpine
    container_name: redis-feast
    ports:
      - "6381:6379"
    volumes:
      - redis-feast-data:/data
    networks:
      - ml-platform

  # BentoML for Model Serving
  bentoml-server:
    build:
      context: ./bentoml
      dockerfile: Dockerfile
    container_name: bentoml-server
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - BENTOML_HOME=/bentoml
      - BENTOML_MODEL_STORE=/bentoml/models
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    depends_on:
      - mlflow-server
      - minio
    volumes:
      - ./bentoml/services:/app/services
      - bentoml-data:/bentoml
    networks:
      - ml-platform
    command: serve /app/services/prediction_service:latest --port 3000

  # Ray for Distributed Training
  ray-head:
    image: rayproject/ray:2.9.0-py310
    container_name: ray-head
    ports:
      - "8265:8265"  # Dashboard
      - "10001:10001"  # Client port
      - "6379:6379"  # Redis port
    environment:
      - RAY_HEAD_NODE=1
    volumes:
      - ./ray/scripts:/app/scripts
      - ray-data:/tmp/ray
    networks:
      - ml-platform
    command: >
      bash -c "
      ray start --head --dashboard-host 0.0.0.0 --block
      "

  # Ray Worker 1
  ray-worker-1:
    image: rayproject/ray:2.9.0-py310
    container_name: ray-worker-1
    depends_on:
      - ray-head
    environment:
      - RAY_HEAD_NODE=0
      - RAY_ADDRESS=ray-head:10001
    volumes:
      - ./ray/scripts:/app/scripts
      - ray-data:/tmp/ray
    networks:
      - ml-platform
    command: >
      bash -c "
      sleep 10 &&
      ray start --address=ray-head:10001 --block
      "

  # Ray Worker 2
  ray-worker-2:
    image: rayproject/ray:2.9.0-py310
    container_name: ray-worker-2
    depends_on:
      - ray-head
    environment:
      - RAY_HEAD_NODE=0
      - RAY_ADDRESS=ray-head:10001
    volumes:
      - ./ray/scripts:/app/scripts
      - ray-data:/tmp/ray
    networks:
      - ml-platform
    command: >
      bash -c "
      sleep 10 &&
      ray start --address=ray-head:10001 --block
      "

  # Jupyter Lab for ML Development
  jupyter-ml:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    container_name: jupyter-ml
    ports:
      - "8889:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - FEAST_REPO_PATH=/app/feast_repo
      - RAY_ADDRESS=ray://ray-head:10001
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - mlflow-server
      - feast-server
      - ray-head
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./feast/feature_repo:/app/feast_repo
      - ./data:/home/jovyan/data
    networks:
      - ml-platform

  # Apache Airflow for ML Pipelines
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    depends_on:
      - airflow-postgres
      - airflow-redis
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://:@airflow-redis:6379/0
      - AIRFLOW__CELERY__BROKER_URL=redis://:@airflow-redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-REPLACE_WITH_VALID_32BYTE_BASE64_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-data:/opt/airflow
    ports:
      - "8090:8080"
    networks:
      - ml-platform
    command: webserver

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://:@airflow-redis:6379/0
      - AIRFLOW__CELERY__BROKER_URL=redis://:@airflow-redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-REPLACE_WITH_VALID_32BYTE_BASE64_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-data:/opt/airflow
    networks:
      - ml-platform
    command: scheduler

  # Airflow Worker
  airflow-worker:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-worker
    depends_on:
      - airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://:@airflow-redis:6379/0
      - AIRFLOW__CELERY__BROKER_URL=redis://:@airflow-redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-REPLACE_WITH_VALID_32BYTE_BASE64_KEY}
      - DUMB_INIT_SETSID=0
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-data:/opt/airflow
    networks:
      - ml-platform
    command: celery worker

  # PostgreSQL for Airflow
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - ml-platform

  # Redis for Airflow
  airflow-redis:
    image: redis:7-alpine
    container_name: airflow-redis
    ports:
      - "6382:6379"
    networks:
      - ml-platform

  # Label Studio for Data Labeling
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    ports:
      - "8091:8080"
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio
      - POSTGRE_USER=labelstudio
      - POSTGRE_PASSWORD=labelstudio
      - POSTGRE_HOST=label-studio-postgres
      - POSTGRE_PORT=5432
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
    depends_on:
      - label-studio-postgres
    volumes:
      - label-studio-data:/label-studio/data
    networks:
      - ml-platform

  # PostgreSQL for Label Studio
  label-studio-postgres:
    image: postgres:15
    container_name: label-studio-postgres
    environment:
      - POSTGRES_DB=labelstudio
      - POSTGRES_USER=labelstudio
      - POSTGRES_PASSWORD=labelstudio
    volumes:
      - label-studio-postgres-data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    networks:
      - ml-platform

  # TensorBoard
  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./tensorboard/logs:/logs
    command: tensorboard --logdir=/logs --host=0.0.0.0
    networks:
      - ml-platform

  # Optuna Dashboard for Hyperparameter Optimization
  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard:latest
    container_name: optuna-dashboard
    ports:
      - "8092:8080"
    environment:
      - OPTUNA_STORAGE=postgresql://optuna:optuna@optuna-postgres:5432/optuna
    depends_on:
      - optuna-postgres
    networks:
      - ml-platform

  # PostgreSQL for Optuna
  optuna-postgres:
    image: postgres:15
    container_name: optuna-postgres
    environment:
      - POSTGRES_DB=optuna
      - POSTGRES_USER=optuna
      - POSTGRES_PASSWORD=optuna
    volumes:
      - optuna-postgres-data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    networks:
      - ml-platform

  # Grafana for ML Monitoring
  grafana-ml:
    image: grafana/grafana:10.2.0
    container_name: grafana-ml
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource,marcusolsson-json-datasource
    volumes:
      - grafana-ml-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ml-platform

  # Prometheus for ML Metrics
  prometheus-ml:
    image: prom/prometheus:latest
    container_name: prometheus-ml
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-ml-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - ml-platform

networks:
  ml-platform:
    driver: bridge

volumes:
  mlflow-data:
  mlflow-postgres-data:
  minio-data:
  feast-data:
  feast-postgres-data:
  redis-feast-data:
  bentoml-data:
  ray-data:
  airflow-data:
  airflow-postgres-data:
  label-studio-data:
  label-studio-postgres-data:
  optuna-postgres-data:
  grafana-ml-data:
  prometheus-ml-data:
