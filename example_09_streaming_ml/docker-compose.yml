version: '3.8'

# Streaming Platform with ML Features Docker Compose
#
# Quick Start:
#   docker-compose up -d
#
# Access:
#   - MySQL: localhost:3315 (user: root, password: streaming_root)
#   - phpMyAdmin: http://localhost:8090
#   - Kafka UI: http://localhost:8091 (if profile enabled)
#
# Generate test data:
#   docker-compose run data_generator

services:
  mysql:
    image: mysql:8.0
    container_name: streaming_ml_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: streaming_root
      MYSQL_DATABASE: streaming_ml_db
      MYSQL_USER: streaming_user
      MYSQL_PASSWORD: streaming_pass
    ports:
      - "3315:3306"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
      - streaming_ml_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - streaming_ml_network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=4G
      - --max_connections=2000

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: streaming_ml_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: streaming_root
    ports:
      - "8090:80"
    networks:
      - streaming_ml_network

  data_generator:
    build:
      context: ../generators
      dockerfile: Dockerfile
    container_name: streaming_ml_generator
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: streaming_ml_db
      MYSQL_USER: streaming_user
      MYSQL_PASSWORD: streaming_pass
      GENERATOR_MODE: ${GENERATOR_MODE:-test}
      # Streaming ML specific settings
      USER_COUNT: ${USER_COUNT:-10000}
      CONTENT_COUNT: ${CONTENT_COUNT:-5000}
      INTERACTION_RATE: ${INTERACTION_RATE:-high}
      ML_FEATURES: ${ML_FEATURES:-true}
    volumes:
      - ../generators/streaming_ml:/app
      - streaming_ml_generator_output:/app/output
    networks:
      - streaming_ml_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Generating streaming ML data...' &&
        python generator.py &&
        echo 'Done!'
      "

  # Optional: Kafka for real-time streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: streaming_ml_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - streaming_ml_network
    profiles:
      - streaming

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streaming_ml_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - streaming_ml_network
    profiles:
      - streaming

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streaming_ml_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - streaming_ml_network
    profiles:
      - streaming

  # Redis for ML model caching
  redis:
    image: redis:7-alpine
    container_name: streaming_ml_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    networks:
      - streaming_ml_network
    profiles:
      - ml
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru

volumes:
  streaming_ml_mysql_data:
    name: streaming_ml_mysql_data
  streaming_ml_generator_output:
    name: streaming_ml_generator_output

networks:
  streaming_ml_network:
    name: streaming_ml_network
    driver: bridge