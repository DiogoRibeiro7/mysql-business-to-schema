version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions-non-major:
        patterns:
          - "*"
    reviewers:
      - "diogoribeiro7"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:15"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-non-major:
        patterns:
          - "*"
    reviewers:
      - "diogoribeiro7"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/generators"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-non-major:
        patterns:
          - "*"
    reviewers:
      - "diogoribeiro7"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
