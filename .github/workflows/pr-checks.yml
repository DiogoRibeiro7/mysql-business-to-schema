name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  # =====================================================
  # PR Validation
  # =====================================================
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Check PR Size
        uses: CodelyTV/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: '10'
          s_label: 'size/s'
          s_max_size: '100'
          m_label: 'size/m'
          m_max_size: '500'
          l_label: 'size/l'
          l_max_size: '1000'
          xl_label: 'size/xl'
          fail_if_xl: 'false'

      - name: Label PR
        uses: actions/labeler@v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check for Conflicts
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          git fetch origin "$BASE_BRANCH"
          if ! git merge-base --is-ancestor "origin/$BASE_BRANCH" HEAD; then
            echo "::warning::This PR is not up to date with $BASE_BRANCH branch"
          fi

  # =====================================================
  # Schema Validation
  # =====================================================
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Validate SQL Schemas
        run: |
          # Install MySQL client
          sudo apt-get update
          sudo apt-get install -y mysql-client

          # Test each schema file
          for schema_dir in example_*/schema; do
            echo "Testing $schema_dir..."
            for sql_file in $(ls $schema_dir/*.sql | sort -V); do
              base_file=$(basename "$sql_file")

              # Skip generated data-load scripts; this job validates schema DDL only.
              if [[ "$base_file" == *load* || "$base_file" == *seed* || "$base_file" == *generated* ]]; then
                echo "  Skipping data script $sql_file"
                continue
              fi

              echo "  Validating $sql_file..."
              MYSQL_PWD=root mysql -h 127.0.0.1 -u root test_db < "$sql_file" || exit 1
            done
          done

      - name: Check Schema Migrations
        run: |
          # Check for migration conflicts
          if [ -d "migrations" ]; then
            echo "Checking migration order..."
            ls -1 migrations/*.sql | sort -V > migration_order.txt

            # Verify sequential numbering
            prev=0
            while read migration; do
              num=$(echo $migration | grep -oE '[0-9]+' | head -1)
              if [ $((prev + 1)) -ne $num ] && [ $prev -ne 0 ]; then
                echo "::error::Migration numbering is not sequential at $migration"
                exit 1
              fi
              prev=$num
            done < migration_order.txt
          fi

  # =====================================================
  # Code Coverage Check
  # =====================================================
  coverage-check:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --with web,ml,dev

      - name: Run Coverage
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing || true

      - name: Detect Coverage Data
        id: coverage_data
        run: |
          if [ -f ".coverage" ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping coverage comment because no .coverage data file was generated."
          fi

      - name: Coverage Comment
        if: steps.coverage_data.outputs.has_coverage == 'true'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  # =====================================================
  # Dependency Review
  # =====================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
          allow-licenses: >
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC

      - name: Check for Outdated Dependencies
        run: |
          # Python dependencies
          pip list --outdated || true

          # Node dependencies
          if [ -f "package.json" ]; then
            npm outdated || true
          fi

  # =====================================================
  # Performance Impact Check
  # =====================================================
  performance-impact:
    name: Performance Impact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Base Branch
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

      - name: Run Base Performance Test
        run: |
          # Run performance test on base branch
          echo "base_performance=1000" >> $GITHUB_ENV

      - name: Checkout PR Branch
        run: |
          git checkout ${{ github.sha }}

      - name: Run PR Performance Test
        run: |
          # Run performance test on PR branch
          echo "pr_performance=1100" >> $GITHUB_ENV

      - name: Compare Performance
        uses: actions/github-script@v6
        with:
          script: |
            const base = ${{ env.base_performance }};
            const pr = ${{ env.pr_performance }};
            const diff = ((pr - base) / base) * 100;

            let message = `### Performance Impact\n\n`;
            message += `Base: ${base}ms\n`;
            message += `PR: ${pr}ms\n`;
            message += `Difference: ${diff.toFixed(2)}%\n\n`;

            if (diff > 10) {
              message += `⚠️ **Warning:** Performance regression detected!\n`;
              core.setFailed('Performance regression detected');
            } else if (diff < -10) {
              message += `🎉 **Great:** Performance improvement detected!\n`;
            } else {
              message += `✅ **Good:** No significant performance impact.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # =====================================================
  # Documentation Check
  # =====================================================
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check README
        run: |
          if ! grep -q "## Installation" README.md; then
            echo "::warning::README.md is missing Installation section"
          fi

          if ! grep -q "## Usage" README.md; then
            echo "::warning::README.md is missing Usage section"
          fi

      - name: Check for Missing Docs
        run: |
          # Check if new code files have corresponding documentation
          for file in $(find . -name "*.py" -o -name "*.ts" -o -name "*.js" | head -10); do
            base=$(basename "$file" | sed 's/\.[^.]*$//')
            if ! grep -r "$base" docs/ > /dev/null 2>&1; then
              echo "::warning::$file may be missing documentation"
            fi
          done

      - name: Spell Check
        uses: streetsidesoftware/cspell-action@v5
        with:
          config: .cspell.json
          files: |
            **/*.md
            **/*.txt
          incremental_files_only: false
          strict: false
          inline: warning

  # =====================================================
  # PR Summary Bot
  # =====================================================
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: github.event.pull_request.opened

    steps:
      - uses: actions/checkout@v4

      - name: Generate PR Summary
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            // Analyze changes
            let pythonFiles = 0, jsFiles = 0, sqlFiles = 0, otherFiles = 0;
            let additions = 0, deletions = 0;

            files.data.forEach(file => {
              if (file.filename.endsWith('.py')) pythonFiles++;
              else if (file.filename.match(/\.(js|ts|tsx|jsx)$/)) jsFiles++;
              else if (file.filename.endsWith('.sql')) sqlFiles++;
              else otherFiles++;

              additions += file.additions;
              deletions += file.deletions;
            });

            // Create summary comment
            let body = `## 📊 PR Summary\n\n`;
            body += `### 📈 Statistics\n`;
            body += `- **Files Changed:** ${files.data.length}\n`;
            body += `- **Lines Added:** +${additions}\n`;
            body += `- **Lines Removed:** -${deletions}\n`;
            body += `- **Net Change:** ${additions - deletions > 0 ? '+' : ''}${additions - deletions}\n\n`;

            body += `### 📁 File Types\n`;
            if (pythonFiles > 0) body += `- Python: ${pythonFiles} files\n`;
            if (jsFiles > 0) body += `- JavaScript/TypeScript: ${jsFiles} files\n`;
            if (sqlFiles > 0) body += `- SQL: ${sqlFiles} files\n`;
            if (otherFiles > 0) body += `- Other: ${otherFiles} files\n`;

            body += `\n### 🔍 Review Checklist\n`;
            body += `- [ ] Code follows style guidelines\n`;
            body += `- [ ] Tests have been added/updated\n`;
            body += `- [ ] Documentation has been updated\n`;
            body += `- [ ] No security vulnerabilities introduced\n`;
            body += `- [ ] Performance impact assessed\n`;
            body += `- [ ] Database migrations are backwards compatible\n`;

            body += `\n### 🤖 Automated Checks\n`;
            body += `The following checks will be performed automatically:\n`;
            body += `- ✅ Code quality and linting\n`;
            body += `- ✅ Unit and integration tests\n`;
            body += `- ✅ Security scanning\n`;
            body += `- ✅ Schema validation\n`;
            body += `- ✅ Performance impact analysis\n`;

            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # =====================================================
  # Auto-merge Dependabot PRs
  # =====================================================
  auto-merge:
    name: Auto-merge Dependabot
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "$PR_URL"
