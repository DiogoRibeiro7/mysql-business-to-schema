name: Normalization Exercises Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  normalization-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate raw exercise files
        run: python tools/check_raw_exercises.py
