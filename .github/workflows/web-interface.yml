name: Web Interface Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-interface-testing:
    name: Test Web Interface
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --with web,dev

      - name: Test Flask app
        continue-on-error: true
        run: |
          cd web_interface
          echo "Checking analytics.py snippet:"
          sed -n '560,570p' analytics.py
          cat > test_app.py <<EOF
          import pytest
          import sys
          import os
          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          from app import app

          @pytest.fixture
          def client():
              app.config['TESTING'] = True
              with app.test_client() as client:
                  yield client

          def test_index_page(client):
              rv = client.get('/')
              assert rv.status_code == 200
              assert b'MySQL' in rv.data

          def test_api_stats(client):
              rv = client.get('/api/stats')
              assert rv.status_code == 200
              json_data = rv.get_json()
              assert 'total_examples' in json_data

          def test_search_page(client):
              rv = client.get('/search')
              assert rv.status_code == 200

          def test_tools_page(client):
              rv = client.get('/tools')
              assert rv.status_code == 200

          def test_documentation_page(client):
              rv = client.get('/documentation')
              assert rv.status_code == 200

          def test_404_page(client):
              rv = client.get('/nonexistent')
              assert rv.status_code == 404
          EOF
          poetry run pytest test_app.py -v

      - name: Check Flask app syntax
        continue-on-error: true
        run: |
          cd web_interface
          poetry run python -m py_compile app.py
