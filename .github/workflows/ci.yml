name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with debug logging'
        required: false
        default: false

env:
  MYSQL_ROOT_PASSWORD: root_password_ci
  MYSQL_DATABASE: test_db

jobs:
  # Job 1: Validate SQL Syntax
  sql-validation:
    name: SQL Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install sqlfluff
        run: |
          pip install sqlfluff==2.3.2
          pip install sqlfluff-templater-dbt

      - name: Create sqlfluff config
        run: |
          cat > .sqlfluff <<EOF
          [sqlfluff]
          dialect = mysql
          templater = raw
          rules = all
          exclude_rules = L031,L034,L036
          max_line_length = 120

          [sqlfluff:indentation]
          tab_space_size = 4
          indent_unit = space

          [sqlfluff:rules:L010]
          capitalisation_policy = upper

          [sqlfluff:rules:L014]
          extended_capitalisation_policy = upper
          EOF

      - name: Lint SQL files
        run: |
          echo "Validating SQL syntax in all examples..."
          find . -name "*.sql" -type f | while read file; do
            echo "Checking: $file"
            sqlfluff lint "$file" --dialect mysql || true
          done

      - name: Generate SQL validation report
        if: always()
        run: |
          mkdir -p reports
          find . -name "*.sql" -type f | while read file; do
            sqlfluff lint "$file" --dialect mysql --format json >> reports/sql_validation.json 2>&1 || true
          done

      - name: Upload SQL validation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-validation-report
          path: reports/sql_validation.json

  # Job 2: Schema Testing with MySQL
  schema-testing:
    name: Schema Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mysql-version: ['8.0', '8.1']
        example: [
          'example_01_clinic',
          'example_02_iot_bins',
          'example_03_smart_energy',
          'example_04_ecommerce',
          'example_05_industrial_iot',
          'example_06_smart_agriculture',
          'example_07_fleet_management',
          'example_08_healthcare_iot',
          'example_09_streaming_ml',
          'example_10_fintech',
          'example_11_social_media',
          'example_12_real_estate',
          'example_13_event_ticketing'
        ]

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"127.0.0.1" -P3306 -u"root" -p"${{ env.MYSQL_ROOT_PASSWORD }}" --silent; do
            echo 'waiting for mysql...'
            sleep 2
          done

      - name: Test ${{ matrix.example }} schema
        run: |
          echo "Testing ${{ matrix.example }} on MySQL ${{ matrix.mysql-version }}"

          # Create database
          mysql -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ matrix.example }}_db;"

          # Load schema files (skip data-load scripts)
          for file in ${{ matrix.example }}/schema/*.sql; do
            if [ -f "$file" ]; then
              case "$file" in
                *load_generated.sql)
                  echo "Skipping data load script: $file"
                  ;;
                *)
                  echo "Loading: $file"
                  mysql -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} ${{ matrix.example }}_db < "$file"
                  ;;
              esac
            fi
          done

          # Run queries if they exist
          if [ -d "${{ matrix.example }}/queries" ]; then
            for file in ${{ matrix.example }}/queries/*.sql; do
              if [ -f "$file" ]; then
                echo "Testing query: $file"
                mysql -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} ${{ matrix.example }}_db < "$file"
              fi
            done
          fi

          # Verify tables were created
          TABLE_COUNT=$(mysql -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} ${{ matrix.example }}_db -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${{ matrix.example }}_db';")
          echo "Created $TABLE_COUNT tables in ${{ matrix.example }}"

          if [ "$TABLE_COUNT" -eq "0" ]; then
            echo "ERROR: No tables created!"
            exit 1
          fi

      - name: Generate schema report
        if: always()
        run: |
          mkdir -p reports
          mysql -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} -e "
            SELECT table_name, table_rows, data_length, index_length
            FROM information_schema.tables
            WHERE table_schema='${{ matrix.example }}_db'
          " > reports/${{ matrix.example }}_schema_report.txt

      - name: Upload schema report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schema-report-${{ matrix.example }}-mysql${{ matrix.mysql-version }}
          path: reports/${{ matrix.example }}_schema_report.txt

  # Job 3: Python Tools Testing
  tools-testing:
    name: Test Python Tools
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --with web,ml,dev

      - name: Run tool tests
        run: |
          cd tools
          # Test schema validator
          python schema_validator.py --help
          python schema_validator.py ../example_01_clinic/schema/ --output ../reports/validation.json || true

          # Test test runner
          python test_runner.py --help || true

      - name: Test generators
        run: |
          for gen_dir in generators/*/; do
            if [ -f "$gen_dir/generate.py" ]; then
              echo "Testing generator: $gen_dir"
              cd "$gen_dir"
              python generate.py --help || true
              cd ../..
            fi
          done

  # Job 4: Web Interface Testing
  web-interface-testing:
    name: Test Web Interface
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --with web,dev

      - name: Test Flask app
        run: |
          cd web_interface
          # Create test file
          cat > test_app.py <<EOF
          import pytest
          import sys
          import os
          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          from app import app

          @pytest.fixture
          def client():
              app.config['TESTING'] = True
              with app.test_client() as client:
                  yield client

          def test_index_page(client):
              rv = client.get('/')
              assert rv.status_code == 200
              assert b'MySQL' in rv.data

          def test_api_stats(client):
              rv = client.get('/api/stats')
              assert rv.status_code == 200
              json_data = rv.get_json()
              assert 'total_examples' in json_data

          def test_search_page(client):
              rv = client.get('/search')
              assert rv.status_code == 200

          def test_tools_page(client):
              rv = client.get('/tools')
              assert rv.status_code == 200

          def test_documentation_page(client):
              rv = client.get('/documentation')
              assert rv.status_code == 200

          def test_404_page(client):
              rv = client.get('/nonexistent')
              assert rv.status_code == 404
          EOF

          # Run tests
          poetry run pytest test_app.py -v

      - name: Check Flask app syntax
        run: |
          cd web_interface
          poetry run python -m py_compile app.py

  # Job 5: Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install security tools
        run: |
          pip install bandit safety pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o reports/bandit_report.json || true

      - name: Check for vulnerable dependencies
        run: |
          safety check --json > reports/safety_report.json || true
          pip-audit --format json --output reports/pip_audit.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: reports/

  # Job 6: Documentation Check
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check README files exist
        run: |
          MISSING_README=""
          for dir in example_*/; do
            if [ ! -f "$dir/README.md" ]; then
              echo "Missing README.md in $dir"
              MISSING_README="$MISSING_README $dir"
            fi
          done

          if [ ! -z "$MISSING_README" ]; then
            echo "ERROR: Missing README files in: $MISSING_README"
            exit 1
          fi

      - name: Validate markdown
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md' --ignore node_modules || true

      - name: Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
        continue-on-error: true

  # Job 7: Performance Testing
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mysql-connector-python pyyaml

      - name: Run performance benchmarks
        run: |
          # Create performance test script
          cat > test_performance.py <<EOF
          import mysql.connector
          import time
          import json

          results = {}

          conn = mysql.connector.connect(
              host='127.0.0.1',
              user='root',
              password='${{ env.MYSQL_ROOT_PASSWORD }}'
          )
          cursor = conn.cursor()

          # Test each example
          examples = [
              'example_01_clinic',
              'example_10_fintech',
              'example_11_social_media'
          ]

          for example in examples:
              print(f"Testing {example}...")
              cursor.execute(f"CREATE DATABASE IF NOT EXISTS {example}_perf")
              cursor.execute(f"USE {example}_perf")

              # Load schema
              start_time = time.time()
              # Load schema files here
              load_time = time.time() - start_time

              results[example] = {
                  'load_time': load_time,
                  'timestamp': time.time()
              }

          # Save results
          with open('performance_results.json', 'w') as f:
              json.dump(results, f, indent=2)

          print("Performance test completed")
          EOF

          python test_performance.py

  # Job 8: Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [sql-validation, schema-testing, tools-testing, web-interface-testing, security-scan, documentation-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Generate changelog
        run: |
          cat > CHANGELOG.md <<EOF
          # Changelog

          ## [$(date +%Y.%m.%d)] - $(date +%Y-%m-%d)

          ### Database Examples
          - 13 comprehensive database examples
          - Coverage across multiple industries
          - Production-ready schemas

          ### Features
          - Web interface for browsing examples
          - Data generators for test data
          - Schema validation tools
          - Performance analysis tools

          ### Testing
          - Automated CI/CD pipeline
          - MySQL 8.0 and 8.1 compatibility
          - Security scanning
          - Performance benchmarks
          EOF

      - name: Create version tag
        if: success()
        run: |
          VERSION="v$(date +%Y.%m.%d)-${{ github.run_number }}"
          git tag $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV

  # Job 9: Deploy Documentation
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install mkdocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

      - name: Build documentation site
        run: |
          # Create mkdocs.yml if it doesn't exist
          if [ ! -f mkdocs.yml ]; then
            cat > mkdocs.yml <<EOF
          site_name: MySQL Business-to-Schema Examples
          site_url: https://yourusername.github.io/mysql-business-to-schema/
          repo_url: https://github.com/yourusername/mysql-business-to-schema

          theme:
            name: material
            features:
              - navigation.tabs
              - navigation.sections
              - search.highlight
              - content.code.copy

          nav:
            - Home: README.md
            - Examples:
              - Overview: EXAMPLES_OVERVIEW.md
              - Clinic: example_01_clinic/README.md
              - IoT Bins: example_02_iot_bins/README.md
              - Smart Energy: example_03_smart_energy/README.md
              - E-commerce: example_04_ecommerce/README.md
            - Tools:
              - Test Runner: tools/README.md
              - Generators: generators/README.md
            - Web Interface: web_interface/README.md

          plugins:
            - search
            - mermaid2

          markdown_extensions:
            - pymdownx.highlight
            - pymdownx.superfences
            - pymdownx.tabbed
            - admonition
          EOF
          fi

          mkdocs build

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  # Final job: Summary
  ci-summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [sql-validation, schema-testing, tools-testing, web-interface-testing, security-scan, documentation-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SQL Validation | ${{ needs.sql-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Testing | ${{ needs.schema-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tools Testing | ${{ needs.tools-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Interface | ${{ needs.web-interface-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.documentation-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
