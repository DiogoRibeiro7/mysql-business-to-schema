services:
  mysql:
    image: mysql:8.0
    container_name: mysql_business_to_schema
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_business_to_schema_data:/var/lib/mysql

volumes:
  mysql_business_to_schema_data:
