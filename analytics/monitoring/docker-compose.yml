version: '3.8'

# Monitoring Stack for MySQL Performance Analytics
# Includes Grafana, Prometheus, MySQL Exporter, and Alert Manager

services:
  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: mysql_monitor_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mysql-performance.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring_network
    depends_on:
      - prometheus

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: mysql_monitor_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_network

  # MySQL Exporter for Clinic Database
  mysql_exporter_clinic:
    image: prom/mysqld-exporter:latest
    container_name: mysql_exporter_clinic
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "exporter:export_pass@tcp(host.docker.internal:3308)/clinic_db"
      MYSQLD_EXPORTER_FLAGS: "--collect.info_schema.innodb_metrics --collect.info_schema.processlist --collect.info_schema.query_response_time --collect.info_schema.tables --collect.perf_schema.eventsstatements --collect.perf_schema.eventswaits --collect.perf_schema.file_events --collect.perf_schema.indexiowaits --collect.perf_schema.tableiowaits --collect.perf_schema.tablelocks"
    networks:
      - monitoring_network

  # MySQL Exporter for IoT Bins Database
  mysql_exporter_iot:
    image: prom/mysqld-exporter:latest
    container_name: mysql_exporter_iot
    restart: unless-stopped
    ports:
      - "9105:9104"
    environment:
      DATA_SOURCE_NAME: "exporter:export_pass@tcp(host.docker.internal:3309)/iot_bins"
      MYSQLD_EXPORTER_FLAGS: "--collect.info_schema.innodb_metrics --collect.info_schema.processlist --collect.perf_schema.eventsstatements"
    networks:
      - monitoring_network

  # MySQL Exporter for E-Commerce Database
  mysql_exporter_ecommerce:
    image: prom/mysqld-exporter:latest
    container_name: mysql_exporter_ecommerce
    restart: unless-stopped
    ports:
      - "9106:9104"
    environment:
      DATA_SOURCE_NAME: "exporter:export_pass@tcp(host.docker.internal:3311)/ecommerce_db"
      MYSQLD_EXPORTER_FLAGS: "--collect.info_schema.innodb_metrics --collect.info_schema.processlist --collect.perf_schema.eventsstatements"
    networks:
      - monitoring_network

  # Alert Manager for notifications
  alertmanager:
    image: prom/alertmanager:latest
    container_name: mysql_monitor_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring_network

  # Node Exporter for host metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: mysql_monitor_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring_network

  # Query Analytics Service
  query_analytics:
    build:
      context: ../
      dockerfile: Dockerfile.analytics
    container_name: mysql_query_analytics
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ANALYTICS_MODE: "production"
      MYSQL_CONNECTIONS: "clinic:3308,iot:3309,ecommerce:3311"
      PROMETHEUS_URL: "http://prometheus:9090"
      GRAFANA_URL: "http://grafana:3000"
    volumes:
      - ./analytics-config.yml:/app/config.yml:ro
      - analytics_data:/app/data
    depends_on:
      - prometheus
      - grafana
    networks:
      - monitoring_network

volumes:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  analytics_data:

networks:
  monitoring_network:
    name: mysql_monitoring_network
    driver: bridge