version: '3.8'

services:
  # Locust Master for Load Testing
  locust-master:
    image: locustio/locust:2.17.0
    container_name: locust-master
    ports:
      - "8089:8089"
      - "5557:5557"
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --master -H http://host.docker.internal:8000
    environment:
      - LOCUST_MODE=master
      - TARGET_HOST=${TARGET_HOST:-http://localhost:8000}
    networks:
      - performance-testing

  # Locust Workers
  locust-worker-1:
    image: locustio/locust:2.17.0
    container_name: locust-worker-1
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host locust-master
    environment:
      - LOCUST_MODE=worker
    depends_on:
      - locust-master
    networks:
      - performance-testing

  locust-worker-2:
    image: locustio/locust:2.17.0
    container_name: locust-worker-2
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host locust-master
    environment:
      - LOCUST_MODE=worker
    depends_on:
      - locust-master
    networks:
      - performance-testing

  locust-worker-3:
    image: locustio/locust:2.17.0
    container_name: locust-worker-3
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host locust-master
    environment:
      - LOCUST_MODE=worker
    depends_on:
      - locust-master
    networks:
      - performance-testing

  # K6 for Advanced Load Testing
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - K6_INFLUXDB_ORGANIZATION=mysql-schema
      - K6_INFLUXDB_BUCKET=k6
      - K6_INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-auth-token}
    networks:
      - performance-testing

  # InfluxDB for K6 Metrics
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123456
      - DOCKER_INFLUXDB_INIT_ORG=mysql-schema
      - DOCKER_INFLUXDB_INIT_BUCKET=k6
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    networks:
      - performance-testing

  # Grafana for Performance Dashboards
  grafana-perf:
    image: grafana/grafana:10.2.0
    container_name: grafana-perf
    ports:
      - "3001:3000"
    volumes:
      - grafana-perf-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    depends_on:
      - influxdb
    networks:
      - performance-testing

  # Gatling for High-Performance Load Testing
  gatling:
    build:
      context: ./gatling
      dockerfile: Dockerfile
    container_name: gatling
    volumes:
      - ./gatling/simulations:/opt/gatling/user-files/simulations
      - ./gatling/resources:/opt/gatling/user-files/resources
      - ./gatling/results:/opt/gatling/results
    environment:
      - JAVA_OPTS=-Xmx4g
    networks:
      - performance-testing

  # JMeter for Complex Scenarios
  jmeter:
    image: justb4/jmeter:5.5
    container_name: jmeter
    volumes:
      - ./jmeter:/tests
      - ./results/jmeter:/results
    environment:
      - JVM_ARGS=-Xmx2g -XX:MaxMetaspaceSize=256m
    networks:
      - performance-testing

  # Chaos Monkey for Chaos Engineering
  chaos-monkey:
    build:
      context: ./chaos
      dockerfile: Dockerfile
    container_name: chaos-monkey
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./chaos/config:/config
    environment:
      - CHAOS_MONKEY_ENABLED=true
      - CHAOS_MONKEY_SCHEDULE=0 */5 * * * *
      - CHAOS_MONKEY_DRY_RUN=false
      - CHAOS_MONKEY_METRICS_ENABLED=true
    networks:
      - performance-testing

  # Pumba for Network Chaos
  pumba:
    image: gaiaadm/pumba:latest
    container_name: pumba
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --log-level info --interval 30s --random netem --duration 10s delay --time 1000 re2:^mysql
    networks:
      - performance-testing

  # Toxiproxy for Network Simulation
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    container_name: toxiproxy
    ports:
      - "8474:8474"  # API
      - "3306:3306"  # MySQL proxy
      - "5432:5432"  # PostgreSQL proxy
      - "6379:6379"  # Redis proxy
      - "9092:9092"  # Kafka proxy
    volumes:
      - ./toxiproxy:/config
    networks:
      - performance-testing

  # Performance Test Coordinator
  test-coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: test-coordinator
    ports:
      - "5000:5000"
    volumes:
      - ./coordinator:/app
      - ./results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres-perf:5432/performance
    depends_on:
      - postgres-perf
      - redis-perf
    networks:
      - performance-testing

  # PostgreSQL for Test Results
  postgres-perf:
    image: postgres:15
    container_name: postgres-perf
    environment:
      - POSTGRES_DB=performance
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-perf-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - performance-testing

  # Redis for Test Coordination
  redis-perf:
    image: redis:7-alpine
    container_name: redis-perf
    ports:
      - "6380:6379"
    volumes:
      - redis-perf-data:/data
    networks:
      - performance-testing

  # Prometheus for Metrics Collection
  prometheus-perf:
    image: prom/prometheus:latest
    container_name: prometheus-perf
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-perf-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - performance-testing

  # Node Exporter for System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - performance-testing

  # cAdvisor for Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - performance-testing

networks:
  performance-testing:
    driver: bridge

volumes:
  influxdb-data:
  grafana-perf-data:
  postgres-perf-data:
  redis-perf-data:
  prometheus-perf-data: