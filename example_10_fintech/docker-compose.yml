version: '3.8'

# FinTech Platform Docker Compose Configuration
#
# Quick Start:
#   docker-compose up -d
#
# Access:
#   - MySQL: localhost:3307 (user: root, password: fintech_root)
#   - phpMyAdmin: http://localhost:8081
#
# Security Note: Change all passwords in production!

services:
  mysql:
    image: mysql:8.0
    container_name: fintech_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fintech_root
      MYSQL_DATABASE: fintech_db
      MYSQL_USER: fintech_user
      MYSQL_PASSWORD: fintech_secure_pass
    ports:
      - "3307:3306"  # Using 3307 to avoid conflicts
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
      - fintech_mysql_data:/var/lib/mysql
      - ./config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - fintech_network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=4G
      - --max_connections=2000
      - --slow_query_log=ON
      - --slow_query_log_file=/var/log/mysql/slow.log
      - --long_query_time=1
      - --log_bin_trust_function_creators=1
      - --transaction-isolation=READ-COMMITTED

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fintech_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: fintech_root
      UPLOAD_LIMIT: 300M
    ports:
      - "8081:80"
    networks:
      - fintech_network

  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fintech_network
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  data_generator:
    build:
      context: ../generators
      dockerfile: Dockerfile
    container_name: fintech_generator
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fintech_db
      MYSQL_USER: fintech_user
      MYSQL_PASSWORD: fintech_secure_pass
      GENERATOR_MODE: ${GENERATOR_MODE:-test}
      # FinTech specific settings
      ENABLE_FRAUD_SIMULATION: ${ENABLE_FRAUD_SIMULATION:-true}
      TRANSACTION_VOLUME: ${TRANSACTION_VOLUME:-high}
      COMPLIANCE_MODE: ${COMPLIANCE_MODE:-strict}
    volumes:
      - ../generators/fintech:/app
      - fintech_generator_output:/app/output
    networks:
      - fintech_network
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 15 &&
        echo 'Starting FinTech data generation...' &&
        echo 'Generating customers and KYC data...' &&
        python generator.py &&
        echo 'Data generation complete!'
      "

  # Fraud detection service (optional)
  fraud_detector:
    build:
      context: ./services/fraud_detector
      dockerfile: Dockerfile
    container_name: fintech_fraud_detector
    depends_on:
      - mysql
      - redis
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fintech_db
      MYSQL_USER: fintech_user
      MYSQL_PASSWORD: fintech_secure_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DETECTION_THRESHOLD: ${DETECTION_THRESHOLD:-0.7}
    networks:
      - fintech_network
    profiles:
      - services
    restart: unless-stopped

  # Transaction processor service (optional)
  transaction_processor:
    build:
      context: ./services/transaction_processor
      dockerfile: Dockerfile
    container_name: fintech_transaction_processor
    depends_on:
      - mysql
      - redis
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fintech_db
      MYSQL_USER: fintech_user
      MYSQL_PASSWORD: fintech_secure_pass
      REDIS_HOST: redis
      PROCESSING_BATCH_SIZE: ${PROCESSING_BATCH_SIZE:-100}
    networks:
      - fintech_network
    profiles:
      - services
    restart: unless-stopped

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: fintech_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fintech_network
    profiles:
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: fintech_grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - fintech_network
    profiles:
      - monitoring

volumes:
  fintech_mysql_data:
    name: fintech_mysql_data
  fintech_generator_output:
    name: fintech_generator_output
  prometheus_data:
    name: fintech_prometheus_data
  grafana_data:
    name: fintech_grafana_data

networks:
  fintech_network:
    name: fintech_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16