# Deployment for Web Demo Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: mysql-business-schema
  labels:
    app: web-demo
    component: frontend
    tier: presentation
  annotations:
    checkov.io/skip1: CKV_K8S_43=Image digests are pinned by release automation per environment.
    checkov.io/skip2: CKV_K8S_35=Application currently consumes DB credentials via environment variables.
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-demo
      component: frontend
  template:
    metadata:
      labels:
        app: web-demo
        component: frontend
        tier: presentation
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web-demo
                topologyKey: kubernetes.io/hostname

      containers:
        - name: web-demo
          image: mysql-business-schema/web-demo:v1.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: ALLOWED_ORIGINS
              value: "*"
            # Database connections
            - name: CLINIC_DB_HOST
              value: "mysql-clinic.mysql-business-schema.svc.cluster.local"
            - name: CLINIC_DB_PORT
              value: "3306"
            - name: CLINIC_DB_USER
              value: "clinic_user"
            - name: CLINIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-secrets
                  key: clinic-app-password
            - name: IOT_DB_HOST
              value: "mysql-iot.mysql-business-schema.svc.cluster.local"
            - name: IOT_DB_PORT
              value: "3306"
            - name: IOT_DB_USER
              value: "iot_user"
            - name: IOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-secrets
                  key: iot-app-password
            - name: ECOMMERCE_DB_HOST
              value: "mysql-ecommerce.mysql-business-schema.svc.cluster.local"
            - name: ECOMMERCE_DB_PORT
              value: "3306"
            - name: ECOMMERCE_DB_USER
              value: "ecommerce_user"
            - name: ECOMMERCE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-secrets
                  key: ecommerce-app-password
            # Features
            - name: ENABLE_QUERY_HISTORY
              value: "true"
            - name: MAX_QUERY_RESULTS
              value: "1000"
            - name: QUERY_TIMEOUT
              value: "30000"
            - name: RATE_LIMIT_WINDOW
              value: "900000"
            - name: RATE_LIMIT_MAX
              value: "100"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true

      volumes:
        - name: app-config
          configMap:
            name: web-demo-config

---
# Service for Web Demo
apiVersion: v1
kind: Service
metadata:
  name: web-demo
  namespace: mysql-business-schema
  labels:
    app: web-demo
    component: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
spec:
  type: LoadBalancer
  selector:
    app: web-demo
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3001
      protocol: TCP

---
# ConfigMap for Web Demo
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-demo-config
  namespace: mysql-business-schema
  labels:
    app: web-demo
data:
  app-config.json: |
    {
      "title": "MySQL Business-to-Schema Demo",
      "description": "Interactive demo for MySQL database examples",
      "features": {
        "schemaExplorer": true,
        "queryPlayground": true,
        "queryHistory": true,
        "queryVisualizer": true,
        "indexAdvisor": true,
        "exportResults": true
      },
      "databases": [
        {
          "id": "clinic",
          "name": "Medical Clinic",
          "description": "Healthcare management system",
          "icon": "🏥",
          "color": "#4CAF50"
        },
        {
          "id": "iot",
          "name": "IoT Waste Bins",
          "description": "Smart city waste management",
          "icon": "🗑️",
          "color": "#2196F3"
        },
        {
          "id": "ecommerce",
          "name": "E-Commerce",
          "description": "Online shopping platform",
          "icon": "🛒",
          "color": "#FF9800"
        },
        {
          "id": "fintech",
          "name": "FinTech",
          "description": "Financial technology platform",
          "icon": "💳",
          "color": "#9C27B0"
        }
      ]
    }

---
# HorizontalPodAutoscaler for Web Demo
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-demo-hpa
  namespace: mysql-business-schema
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-demo
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
