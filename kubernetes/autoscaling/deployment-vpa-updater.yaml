# VPA Updater
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-updater
  namespace: kube-system
  annotations:
    checkov.io/skip1: CKV_K8S_43=Image digests are pinned during release promotion.
    checkov.io/skip2: CKV_K8S_38=Controller requires service account token to call Kubernetes API.
    checkov.io/skip3: CKV_K8S_8=Probe configuration is handled in upstream VPA chart defaults.
    checkov.io/skip4: CKV_K8S_9=Probe configuration is handled in upstream VPA chart defaults.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-updater
  template:
    metadata:
      labels:
        app: vpa-updater
    spec:
      serviceAccountName: vpa-updater
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: updater
          image: k8s.gcr.io/autoscaling/vpa-updater:0.13.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          args:
            - --min-replicas=2
            - --eviction-tolerance=0.5
            - --evict-after-oom-threshold=3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
