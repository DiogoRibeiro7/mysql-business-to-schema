# Vertical Pod Autoscaler configurations for optimizing resource requests and limits

---
# VPA for MySQL StatefulSets
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mysql-clinic-vpa
  namespace: mysql-business-schema
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mysql-clinic
  updatePolicy:
    # Can be "Off", "Initial", or "Auto"
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: mysql
        minAllowed:
          cpu: 500m
          memory: 1Gi
        maxAllowed:
          cpu: 4
          memory: 8Gi
        controlledResources: ["cpu", "memory"]
        mode: Auto
      - containerName: mysqld-exporter
        minAllowed:
          cpu: 50m
          memory: 50Mi
        maxAllowed:
          cpu: 200m
          memory: 200Mi
        mode: Auto
  recommenders:
    - name: default

---
# VPA for IoT Database (higher resource requirements)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mysql-iot-vpa
  namespace: mysql-business-schema
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mysql-iot
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: mysql
        minAllowed:
          cpu: 1
          memory: 2Gi
        maxAllowed:
          cpu: 8
          memory: 16Gi
        controlledResources: ["cpu", "memory"]
        mode: Auto

---
# VPA for Web Demo (Recommendation mode only)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: web-demo-vpa
  namespace: mysql-business-schema
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-demo
  updatePolicy:
    # Only provide recommendations, don't update automatically
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: web-demo
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 2
          memory: 2Gi
        controlledResources: ["cpu", "memory"]
  recommenders:
    - name: default

---
# VPA for Prometheus
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prometheus-vpa
  namespace: mysql-business-schema
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prometheus
  updatePolicy:
    # Only set resources on pod creation
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: prometheus
        minAllowed:
          cpu: 200m
          memory: 512Mi
        maxAllowed:
          cpu: 4
          memory: 8Gi
        controlledResources: ["cpu", "memory"]

---
# VPA for Grafana
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana-vpa
  namespace: mysql-business-schema
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grafana
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: grafana
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 1
          memory: 1Gi
        controlledResources: ["cpu", "memory"]
        mode: Auto

---
# VPA Recommender Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-recommender
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-recommender
  template:
    metadata:
      labels:
        app: vpa-recommender
    spec:
      serviceAccountName: vpa-recommender
      containers:
        - name: recommender
          image: k8s.gcr.io/autoscaling/vpa-recommender:0.13.0
          args:
            - --storage=prometheus
            - --prometheus-address=http://prometheus.mysql-business-schema.svc.cluster.local:9090
            - --recommendation-margin=0.15
            - --pod-recommendation-min-cpu-millicores=50
            - --pod-recommendation-min-memory-mb=50
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi

---
# VPA Admission Controller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-admission-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-admission-controller
  template:
    metadata:
      labels:
        app: vpa-admission-controller
    spec:
      serviceAccountName: vpa-admission-controller
      containers:
        - name: admission-controller
          image: k8s.gcr.io/autoscaling/vpa-admission-controller:0.13.0
          args:
            - --tls-cert-file=/etc/tls-certs/tls.crt
            - --tls-private-key=/etc/tls-certs/tls.key
            - --webhook-timeout-seconds=30
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls-certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: vpa-tls-certs

---
# VPA Updater
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-updater
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-updater
  template:
    metadata:
      labels:
        app: vpa-updater
    spec:
      serviceAccountName: vpa-updater
      containers:
        - name: updater
          image: k8s.gcr.io/autoscaling/vpa-updater:0.13.0
          args:
            - --min-replicas=2
            - --eviction-tolerance=0.5
            - --evict-after-oom-threshold=3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
