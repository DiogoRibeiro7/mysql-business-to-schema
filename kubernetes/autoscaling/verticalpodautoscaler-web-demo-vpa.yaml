# VPA for Web Demo (Recommendation mode only)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: web-demo-vpa
  namespace: mysql-business-schema
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-demo
  updatePolicy:
    # Only provide recommendations, don't update automatically
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: web-demo
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 2
          memory: 2Gi
        controlledResources: ["cpu", "memory"]
  recommenders:
    - name: default
