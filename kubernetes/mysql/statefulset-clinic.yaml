# StatefulSet for MySQL Clinic Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-clinic
  namespace: mysql-business-schema
  labels:
    app: mysql
    database: clinic
    component: database
  annotations:
    checkov.io/skip1: CKV_K8S_43=Image digests are pinned during release promotion.
    checkov.io/skip2: CKV_K8S_35=MySQL credentials are currently injected through Kubernetes secret environment variables.
    checkov.io/skip3: CKV_K8S_22=MySQL and backup sidecars require writable filesystems.
    checkov.io/skip4: CKV_K8S_40=MySQL runtime UID is constrained by upstream image filesystem ownership.
spec:
  serviceName: mysql-clinic-headless
  replicas: 3
  selector:
    matchLabels:
      app: mysql
      database: clinic
  template:
    metadata:
      labels:
        app: mysql
        database: clinic
        component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Initialize MySQL configuration
        - name: init-mysql
          image: mysql:8.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          command:
            - bash
            - "-c"
            - |
              set -ex
              # Generate server-id from Pod ordinal index
              [[ `hostname` =~ -([0-9]+)$ ]] || exit 1
              ordinal=${BASH_REMATCH[1]}
              echo [mysqld] > /mnt/conf.d/server-id.cnf
              echo server-id=$((100 + $ordinal)) >> /mnt/conf.d/server-id.cnf
              # Copy appropriate configuration from ConfigMap
              cp /mnt/config-map/my.cnf /mnt/conf.d/
              # Add replication configuration for replicas
              if [[ $ordinal -gt 0 ]]; then
                echo "read_only = ON" >> /mnt/conf.d/server-id.cnf
              fi
          volumeMounts:
            - name: conf
              mountPath: /mnt/conf.d
            - name: config-map
              mountPath: /mnt/config-map
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

        # Clone data from previous peer for new replicas
        - name: clone-mysql
          image: gcr.io/google-samples/xtrabackup:1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          command:
            - bash
            - "-c"
            - |
              set -ex
              # Skip clone on primary (ordinal 0)
              [[ `hostname` =~ -([0-9]+)$ ]] || exit 1
              ordinal=${BASH_REMATCH[1]}
              [[ $ordinal -eq 0 ]] && exit 0
              # Clone data from previous peer
              ncat --recv-only mysql-clinic-$(($ordinal-1)).mysql-clinic-headless 3307 | xbstream -x -C /var/lib/mysql
              xtrabackup --prepare --target-dir=/var/lib/mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: conf
              mountPath: /etc/mysql/conf.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

      containers:
        # Main MySQL container
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root-secrets
                  key: mysql-root-password-clinic
            - name: MYSQL_DATABASE
              value: clinic_db
            - name: MYSQL_USER
              value: clinic_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-secrets
                  key: clinic-app-password
          ports:
            - name: mysql
              containerPort: 3306
            - name: xtrabackup
              containerPort: 3307
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mysql
                - -h
                - localhost
                - -e
                - "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: conf
              mountPath: /etc/mysql/conf.d
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

        # Xtrabackup sidecar for backups
        - name: xtrabackup
          image: gcr.io/google-samples/xtrabackup:1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: xtrabackup
              containerPort: 3307
          command:
            - bash
            - "-c"
            - |
              set -ex
              cd /var/lib/mysql
              # Start backup server on port 3307
              exec ncat --listen --keep-open --send-only --max-conns=1 3307 -c \
                "xtrabackup --backup --stream=xbstream --host=127.0.0.1 --user=root"
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: xtrabackup
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: xtrabackup
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql

        # MySQL Exporter for Prometheus monitoring
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.15.1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          env:
            - name: DATA_SOURCE_NAME
              value: "exporter:exporter_password@(localhost:3306)/clinic_db"
          ports:
            - name: metrics
              containerPort: 9104
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "100Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: conf
          emptyDir: {}
        - name: config-map
          configMap:
            name: mysql-config
        - name: schema
          configMap:
            name: clinic-schema

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: mysql
          database: clinic
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi

---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: mysql-clinic-headless
  namespace: mysql-business-schema
  labels:
    app: mysql
    database: clinic
spec:
  clusterIP: None
  selector:
    app: mysql
    database: clinic
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: xtrabackup
      port: 3307
      targetPort: 3307

---
# Regular Service for client connections
apiVersion: v1
kind: Service
metadata:
  name: mysql-clinic
  namespace: mysql-business-schema
  labels:
    app: mysql
    database: clinic
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  selector:
    app: mysql
    database: clinic
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP

---
# Service for read replicas only
apiVersion: v1
kind: Service
metadata:
  name: mysql-clinic-read
  namespace: mysql-business-schema
  labels:
    app: mysql
    database: clinic
    type: read-replica
spec:
  type: ClusterIP
  selector:
    app: mysql
    database: clinic
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  sessionAffinity: None
