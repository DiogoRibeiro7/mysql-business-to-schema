version: '3.8'

# Social Media Platform Docker Compose
#
# Quick Start:
#   docker-compose up -d
#
# Access:
#   - MySQL: localhost:3316 (user: root, password: social_root)
#   - phpMyAdmin: http://localhost:8092
#   - Neo4j Browser: http://localhost:7474 (if profile enabled)
#
# Generate test data:
#   docker-compose run data_generator

services:
  mysql:
    image: mysql:8.0
    container_name: social_media_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: social_root
      MYSQL_DATABASE: social_media_db
      MYSQL_USER: social_user
      MYSQL_PASSWORD: social_pass
    ports:
      - "3316:3306"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
      - social_media_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - social_media_network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=4G
      - --max_connections=2000

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: social_media_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: social_root
    ports:
      - "8092:80"
    networks:
      - social_media_network

  data_generator:
    build:
      context: ../generators
      dockerfile: Dockerfile
    container_name: social_media_generator
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: social_media_db
      MYSQL_USER: social_user
      MYSQL_PASSWORD: social_pass
      GENERATOR_MODE: ${GENERATOR_MODE:-test}
      # Social media specific settings
      USER_COUNT: ${USER_COUNT:-10000}
      POST_COUNT: ${POST_COUNT:-50000}
      FRIENDSHIP_DENSITY: ${FRIENDSHIP_DENSITY:-0.05}
      VIRAL_CONTENT: ${VIRAL_CONTENT:-true}
    volumes:
      - ../generators/social_media:/app
      - social_media_generator_output:/app/output
    networks:
      - social_media_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Generating social media data...' &&
        python generator.py &&
        echo 'Done!'
      "

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: social_media_redis
    restart: unless-stopped
    ports:
      - "6383:6379"
    networks:
      - social_media_network
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru

  # Optional: Neo4j for graph relationships
  neo4j:
    image: neo4j:5
    container_name: social_media_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/social_graph_pass
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - social_media_neo4j_data:/data
      - social_media_neo4j_logs:/logs
    networks:
      - social_media_network
    profiles:
      - graph

volumes:
  social_media_mysql_data:
    name: social_media_mysql_data
  social_media_generator_output:
    name: social_media_generator_output
  social_media_neo4j_data:
    name: social_media_neo4j_data
  social_media_neo4j_logs:
    name: social_media_neo4j_logs

networks:
  social_media_network:
    name: social_media_network
    driver: bridge