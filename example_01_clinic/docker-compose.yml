version: '3.8'

# Medical Clinic Management System Docker Compose
#
# Quick Start:
#   docker-compose up -d
#
# Access:
#   - MySQL: localhost:3308 (user: root, password: clinic_root)
#   - phpMyAdmin: http://localhost:8082
#
# Generate test data:
#   docker-compose run data_generator

services:
  mysql:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: clinic_root
      MYSQL_DATABASE: clinic_db
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: clinic_pass
    ports:
      - "3308:3306"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
      - clinic_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - clinic_network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clinic_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: clinic_root
    ports:
      - "8082:80"
    networks:
      - clinic_network

  data_generator:
    build:
      context: ../generators
      dockerfile: Dockerfile
    container_name: clinic_generator
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: clinic_db
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: clinic_pass
      GENERATOR_MODE: ${GENERATOR_MODE:-test}
    volumes:
      - ../generators/clinic:/app
      - clinic_generator_output:/app/output
    networks:
      - clinic_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Generating clinic data...' &&
        python generator.py &&
        echo 'Done!'
      "

volumes:
  clinic_mysql_data:
    name: clinic_mysql_data
  clinic_generator_output:
    name: clinic_generator_output

networks:
  clinic_network:
    name: clinic_network
    driver: bridge