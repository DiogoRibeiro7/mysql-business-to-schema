type Query {
  # Customer queries
  customer(id: ID!): Customer
  currentCustomer: Customer
  customerAddresses(customerId: ID!): [CustomerAddress!]!

  # Restaurant queries
  restaurant(id: ID!): Restaurant
  restaurantBySlug(slug: String!): Restaurant
  nearbyRestaurants(
    latitude: Float!
    longitude: Float!
    radiusKm: Float = 5
    cuisineTypes: [String!]
    priceRange: PriceRange
    minRating: Float
    limit: Int = 20
  ): [Restaurant!]!
  searchRestaurants(query: String!, limit: Int = 20): [Restaurant!]!

  # Menu queries
  menuCategories(restaurantId: ID!): [MenuCategory!]!
  menuItems(
    restaurantId: ID!
    categoryId: ID
    dietary: DietaryFilter
  ): [MenuItem!]!
  menuItem(id: ID!): MenuItem

  # Order queries
  order(id: ID!): Order
  customerOrders(
    customerId: ID!
    status: OrderStatus
    limit: Int = 20
    offset: Int = 0
  ): [Order!]!
  trackOrder(orderId: ID!): DeliveryTracking

  # Driver queries
  driver(id: ID!): Driver
  availableDrivers(
    latitude: Float!
    longitude: Float!
    radiusKm: Float = 5
  ): [Driver!]!

  # Zone queries
  deliveryZone(latitude: Float!, longitude: Float!): DeliveryZone
  activeZones: [DeliveryZone!]!

  # Promotion queries
  promotion(code: String!): Promotion
  activePromotions(segment: CustomerSegment): [Promotion!]!

  # Review queries
  restaurantReviews(
    restaurantId: ID!
    limit: Int = 20
    offset: Int = 0
  ): [RestaurantReview!]!
}

type Mutation {
  # Customer management
  registerCustomer(input: RegisterCustomerInput!): AuthResponse!
  loginCustomer(email: String!, password: String!): AuthResponse!
  updateCustomerProfile(input: UpdateCustomerInput!): Customer!
  addCustomerAddress(input: AddressInput!): CustomerAddress!
  deleteCustomerAddress(addressId: ID!): Boolean!

  # Restaurant management
  registerRestaurant(input: RegisterRestaurantInput!): Restaurant!
  updateRestaurant(id: ID!, input: UpdateRestaurantInput!): Restaurant!
  updateRestaurantHours(restaurantId: ID!, hours: [RestaurantHoursInput!]!): [RestaurantHours!]!

  # Menu management
  createMenuCategory(restaurantId: ID!, input: MenuCategoryInput!): MenuCategory!
  createMenuItem(categoryId: ID!, input: MenuItemInput!): MenuItem!
  updateMenuItem(id: ID!, input: UpdateMenuItemInput!): MenuItem!
  toggleItemAvailability(itemId: ID!, available: Boolean!): MenuItem!

  # Order management
  createOrder(input: CreateOrderInput!): Order!
  confirmOrder(orderId: ID!): Order!
  cancelOrder(orderId: ID!, reason: String!): Order!
  scheduleOrder(input: ScheduleOrderInput!): Order!

  # Driver management
  registerDriver(input: RegisterDriverInput!): Driver!
  updateDriverStatus(driverId: ID!, status: DriverStatus!): Driver!
  updateDriverLocation(driverId: ID!, latitude: Float!, longitude: Float!): Boolean!
  acceptOrder(driverId: ID!, orderId: ID!): Order!
  completeDelivery(orderId: ID!): Order!

  # Payment
  addPaymentMethod(input: PaymentMethodInput!): PaymentMethod!
  removePaymentMethod(id: ID!): Boolean!
  processPayment(orderId: ID!, paymentMethodId: ID!): PaymentResult!

  # Reviews and ratings
  submitRestaurantReview(input: RestaurantReviewInput!): RestaurantReview!
  rateDriver(input: DriverRatingInput!): DriverRating!

  # Promotions
  applyPromotion(orderId: ID!, code: String!): Order!
}

type Subscription {
  # Order tracking
  orderUpdates(orderId: ID!): OrderUpdate!
  deliveryTracking(orderId: ID!): DeliveryTracking!

  # Driver tracking
  driverLocation(driverId: ID!): LocationUpdate!

  # Restaurant updates
  restaurantOrderUpdates(restaurantId: ID!): Order!

  # Zone updates
  zoneUpdates(zoneId: ID!): ZoneUpdate!
}

# ============================================================================
# CUSTOMER TYPES
# ============================================================================

type Customer {
  id: ID!
  email: String!
  phoneNumber: String!
  firstName: String!
  lastName: String!
  dateOfBirth: Date
  dietaryRestrictions: [String!]
  preferredCuisines: [String!]
  defaultTipPercentage: Float!
  status: CustomerStatus!
  emailVerified: Boolean!
  phoneVerified: Boolean!
  loyaltyPoints: Int!
  loyaltyTier: LoyaltyTier!
  totalOrders: Int!
  totalSpent: Float!
  referralCode: String
  createdAt: DateTime!
  lastOrderAt: DateTime

  # Relations
  addresses: [CustomerAddress!]!
  orders(limit: Int = 20): [Order!]!
  paymentMethods: [PaymentMethod!]!
