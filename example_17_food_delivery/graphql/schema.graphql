  GOLD
  PLATINUM
}

enum RestaurantStatus {
  PENDING
  ACTIVE
  SUSPENDED
  CLOSED
}

enum PriceRange {
  BUDGET      # $
  MODERATE    # $$
  PREMIUM     # $$$
  LUXURY      # $$$$
}

enum DayOfWeek {
  MONDAY
  TUESDAY
  WEDNESDAY
