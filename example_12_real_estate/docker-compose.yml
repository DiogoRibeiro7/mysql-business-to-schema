version: '3.8'

# Real Estate Management Platform Docker Compose
#
# Quick Start:
#   docker-compose up -d
#
# Access:
#   - MySQL: localhost:3317 (user: root, password: realestate_root)
#   - phpMyAdmin: http://localhost:8093
#
# Generate test data:
#   docker-compose run data_generator

services:
  mysql:
    image: mysql:8.0
    container_name: real_estate_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: realestate_root
      MYSQL_DATABASE: real_estate_db
      MYSQL_USER: realestate_user
      MYSQL_PASSWORD: realestate_pass
    ports:
      - "3317:3306"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
      - real_estate_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - real_estate_network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=2G
      - --max_connections=500

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: real_estate_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: realestate_root
    ports:
      - "8093:80"
    networks:
      - real_estate_network

  data_generator:
    build:
      context: ../generators
      dockerfile: Dockerfile
    container_name: real_estate_generator
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: real_estate_db
      MYSQL_USER: realestate_user
      MYSQL_PASSWORD: realestate_pass
      GENERATOR_MODE: ${GENERATOR_MODE:-test}
      # Real estate specific settings
      PROPERTY_COUNT: ${PROPERTY_COUNT:-5000}
      AGENT_COUNT: ${AGENT_COUNT:-100}
      MARKET_TYPE: ${MARKET_TYPE:-mixed}
      PRICE_RANGE: ${PRICE_RANGE:-medium}
    volumes:
      - ../generators/real_estate:/app
      - real_estate_generator_output:/app/output
    networks:
      - real_estate_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Generating real estate data...' &&
        python generator.py &&
        echo 'Done!'
      "

  # Optional: ElasticSearch for property search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: real_estate_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - real_estate_elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - real_estate_network
    profiles:
      - search

  # Optional: Kibana for visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: real_estate_kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - real_estate_network
    profiles:
      - search

volumes:
  real_estate_mysql_data:
    name: real_estate_mysql_data
  real_estate_generator_output:
    name: real_estate_generator_output
  real_estate_elasticsearch_data:
    name: real_estate_elasticsearch_data

networks:
  real_estate_network:
    name: real_estate_network
    driver: bridge