  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile
  #   container_name: hotel_chain_api
  #   restart: unless-stopped
  #   environment:
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_NAME: hotel_chain
  #     DB_USER: ${MYSQL_USER:-hotel_admin}
  #     DB_PASSWORD: ${MYSQL_PASSWORD:-hotel_pass_2024}
  #     JWT_SECRET: ${JWT_SECRET:-your-secret-key}
  #     API_PORT: ${API_PORT:-3000}
  #   ports:
  #     - "${API_PORT:-3000}:3000"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - hotel_network

  # Redis for caching room availability
  redis:
    image: redis:7-alpine
    container_name: hotel_chain_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - hotel_network

