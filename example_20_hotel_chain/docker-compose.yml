version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hotel_chain_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: hotel_chain
      MYSQL_USER: ${MYSQL_USER:-hotel_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_pass_2024}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3340}:3306"
    volumes:
      - hotel_data:/var/lib/mysql
      - ./schema:/docker-entrypoint-initdb.d:ro
      - ./config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=2000
      - --innodb_buffer_pool_size=4G
      - --innodb_log_file_size=1G
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_flush_method=O_DIRECT
      - --innodb_file_per_table=ON
      - --event_scheduler=ON
      - --slow_query_log=ON
      - --long_query_time=2
      - --log_queries_not_using_indexes=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel_network

  adminer:
    image: adminer:latest
    container_name: hotel_chain_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8090}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hotel_network

  # Hotel Management API (when implemented)
