# AlertManager Configuration
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@mysql-schema.local'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  group_by: ['alertname', 'cluster', 'service', 'database']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
      routes:
        - match:
            team: database
          receiver: 'database-critical'
        - match:
            team: infrastructure
          receiver: 'infrastructure-critical'

    # Warning alerts - grouped notifications
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    # Database-specific alerts
    - match:
        service: mysql
      receiver: 'database-receiver'
      routes:
        - match:
            alert_type: replication
          receiver: 'mysql-replication'
        - match:
            alert_type: performance
          receiver: 'mysql-performance'

    # Business metric alerts
    - match:
        alert_type: business
      receiver: 'business-receiver'
      group_by: ['database', 'metric_type']

    # Development environment - less aggressive
    - match:
        environment: development
      receiver: 'dev-receiver'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 24h

# Inhibition rules
inhibit_rules:
  # Inhibit warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Inhibit all alerts when maintenance mode is active
  - source_match:
      alertname: 'MaintenanceMode'
    target_match_re:
      severity: '.*'
    equal: ['cluster', 'database']

# Receivers configuration
receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://webhook-logger:8080/webhook'
        send_resolved: true

  - name: 'critical-receiver'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        details:
          firing: '{{ template "pagerduty.default.instances" . }}'
    slack_configs:
      - channel: '#critical-alerts'
        title: '🚨 Critical Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: 'oncall@example.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'
        send_resolved: true

  - name: 'warning-receiver'
    slack_configs:
      - channel: '#warning-alerts'
        title: '⚠️ Warning Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: 'team@example.com'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'
        send_resolved: false

  - name: 'database-receiver'
    webhook_configs:
      - url: 'http://database-webhook:8080/alerts'
    slack_configs:
      - channel: '#database-alerts'
        title: '🗄️ Database Alert: {{ .GroupLabels.database }}'
        text: '{{ template "slack.database.text" . }}'
        send_resolved: true
    email_configs:
      - to: 'dba-team@example.com'
        headers:
          Subject: '[DB] {{ .GroupLabels.database }} - {{ .GroupLabels.alertname }}'

  - name: 'database-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_DB_KEY}'
        client: 'MySQL Schema Monitor'
        client_url: 'http://grafana:3000'
    slack_configs:
      - channel: '#database-critical'
        username: 'MySQL Alert Bot'
        icon_emoji: ':mysql:'

  - name: 'infrastructure-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_INFRA_KEY}'
    slack_configs:
      - channel: '#infrastructure-critical'

  - name: 'mysql-replication'
    email_configs:
      - to: 'mysql-replication@example.com'
        headers:
          Subject: '[MySQL Replication] {{ .GroupLabels.instance }}'
    webhook_configs:
      - url: 'http://mysql-automation:8080/replication-alerts'

  - name: 'mysql-performance'
    slack_configs:
      - channel: '#mysql-performance'
        send_resolved: false

  - name: 'business-receiver'
    webhook_configs:
      - url: 'http://business-metrics:8080/alerts'
    email_configs:
      - to: 'business-analytics@example.com'
        headers:
          Subject: '[Business Metric] {{ .GroupLabels.metric_type }}'

  - name: 'dev-receiver'
    slack_configs:
      - channel: '#dev-alerts'
        send_resolved: false