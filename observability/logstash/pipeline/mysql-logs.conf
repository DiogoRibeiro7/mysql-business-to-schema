# Logstash Pipeline Configuration for MySQL Logs

input {
  # MySQL error logs
  file {
    path => "/var/log/mysql/error.log"
    start_position => "beginning"
    tags => ["mysql", "error"]
    type => "mysql-error"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }

  # MySQL slow query logs
  file {
    path => "/var/log/mysql/slow-query.log"
    start_position => "beginning"
    tags => ["mysql", "slow-query"]
    type => "mysql-slow"
    codec => multiline {
      pattern => "^# Time:"
      negate => true
      what => "previous"
    }
  }

  # MySQL general logs
  file {
    path => "/var/log/mysql/general.log"
    start_position => "beginning"
    tags => ["mysql", "general"]
    type => "mysql-general"
  }

  # Application logs from containers via Filebeat
  beats {
    port => 5044
    tags => ["application", "container"]
  }

  # Syslog for system metrics
  syslog {
    port => 5514
    tags => ["syslog", "system"]
  }

  # HTTP input for direct log shipping
  http {
    port => 8080
    codec => json
    tags => ["http", "direct"]
  }

  # Kafka input for streaming logs
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["mysql-logs", "app-logs", "system-logs"]
    group_id => "logstash-consumer"
    codec => json
    tags => ["kafka", "streaming"]
  }
}

filter {
  # Parse MySQL error logs
  if [type] == "mysql-error" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{NUMBER:thread_id} \[%{WORD:level}\] %{GREEDYDATA:error_message}"
      }
    }

    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }

    # Extract error codes
    if [error_message] =~ /\[MY-[0-9]+\]/ {
      grok {
        match => {
          "error_message" => "\[MY-%{NUMBER:error_code}\]"
        }
        tag_on_failure => []
      }
    }

    # Add severity based on log level
    if [level] == "ERROR" {
      mutate {
        add_field => { "severity" => "high" }
      }
    } else if [level] == "Warning" {
      mutate {
        add_field => { "severity" => "medium" }
      }
    } else {
      mutate {
        add_field => { "severity" => "low" }
      }
    }
  }

  # Parse MySQL slow query logs
  if [type] == "mysql-slow" {
    grok {
      match => {
        "message" => "# Time: %{TIMESTAMP_ISO8601:timestamp}\n# User@Host: %{USER:user}\[%{USER:current_user}\] @ %{HOSTNAME:client_host} \[%{IP:client_ip}\]\n# Query_time: %{NUMBER:query_time:float} Lock_time: %{NUMBER:lock_time:float} Rows_sent: %{NUMBER:rows_sent:int} Rows_examined: %{NUMBER:rows_examined:int}\n%{GREEDYDATA:query}"
      }
    }

    # Parse query to extract operation type
    if [query] {
      grok {
        match => {
          "query" => "^%{WORD:operation}"
        }
        tag_on_failure => []
      }
    }

    # Add performance classification
    if [query_time] >= 10 {
      mutate {
        add_field => { "performance_class" => "critical" }
        add_tag => [ "critical_slow_query" ]
      }
    } else if [query_time] >= 5 {
      mutate {
        add_field => { "performance_class" => "warning" }
        add_tag => [ "warning_slow_query" ]
      }
    } else {
      mutate {
        add_field => { "performance_class" => "acceptable" }
      }
    }

    # Extract database name from query
    grok {
      match => {
        "query" => "USE `%{WORD:database}`"
      }
      tag_on_failure => []
    }
  }

  # Parse application logs
  if "application" in [tags] {
    # Parse JSON logs
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "app_log"
      }

      # Flatten nested fields
      if [app_log][timestamp] {
        date {
          match => [ "[app_log][timestamp]", "ISO8601" ]
          target => "@timestamp"
        }
      }

      if [app_log][level] {
        mutate {
          add_field => { "log_level" => "%{[app_log][level]}" }
        }
      }

      if [app_log][service] {
        mutate {
          add_field => { "service_name" => "%{[app_log][service]}" }
        }
      }
    }

    # Extract container metadata
    if [container] {
      mutate {
        add_field => {
          "container_id" => "%{[container][id]}"
          "container_name" => "%{[container][name]}"
          "container_image" => "%{[container][image][name]}"
        }
      }
    }
  }

  # Parse system logs
  if "syslog" in [tags] {
    syslog_pri { }
    date {
      match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }

  # Common enrichments for all logs
  # Add environment metadata
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "cluster" => "${CLUSTER_NAME:default}"
      "region" => "${REGION:us-east-1}"
    }
  }

  # GeoIP enrichment for client IPs
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      add_field => [ "[geoip][coordinates]", "%{[geoip][longitude]}" ]
      add_field => [ "[geoip][coordinates]", "%{[geoip][latitude]}" ]
    }
  }

  # Add fingerprint for deduplication
  fingerprint {
    source => "message"
    target => "[@metadata][fingerprint]"
    method => "SHA256"
    key => "mysql-schema-logs"
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "port", "@version" ]
  }

  # Add processing timestamp
  ruby {
    code => "event.set('processed_at', Time.now.utc.iso8601)"
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "mysql-logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][fingerprint]}"
    template_name => "mysql-logs"
    template => "/usr/share/logstash/templates/mysql-logs.json"
    template_overwrite => true
  }

  # Send critical errors to monitoring webhook
  if [severity] == "high" or [performance_class] == "critical" {
    http {
      url => "http://alerting-webhook:8080/critical"
      http_method => "post"
      format => "json"
    }
  }

  # Send to Kafka for stream processing
  if "streaming" not in [tags] {
    kafka {
      bootstrap_servers => "kafka:9092"
      topic_id => "processed-logs"
      codec => json
    }
  }

  # Store slow queries in separate index
  if [type] == "mysql-slow" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "mysql-slow-queries-%{+YYYY.MM}"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }

  # Debug output (disable in production)
  if "${DEBUG_MODE:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}