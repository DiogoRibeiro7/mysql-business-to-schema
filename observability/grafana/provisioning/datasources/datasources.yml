apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'

  - name: MySQL
    type: mysql
    access: proxy
    url: mysql:3306
    database: information_schema
    user: root
    secureJsonData:
      password: rootpassword
    editable: true
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
