[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "mysql-business-to-schema"
version = "0.1.0"
description = "Business narratives to production-ready MySQL schemas with generators"
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
Faker = "24.11.0"
PyYAML = "6.0.2"
numpy = "1.26.4"
mysql-connector-python = "9.6.0"

[tool.poetry.group.web.dependencies]
Flask = "3.1.2"
Flask-CORS = "6.0.2"
Markdown = "3.10.2"
Pygments = "2.16.1"
gunicorn = "21.2.0"
pandas = "2.3.3"
matplotlib = "3.10.8"
seaborn = "0.12.2"
graphviz = "0.21"

[tool.poetry.group.ml.dependencies]
pandas = "2.3.3"
scikit-learn = "1.4.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.2"
pytest-cov = "5.0.0"
pytest-mock = "3.14.0"
pytest-flask = "1.3.0"
black = "24.10.0"
isort = "5.13.2"
flake8 = "7.1.1"
mypy = "1.11.2"
pylint = "3.2.7"
bandit = "1.7.9"
radon = "6.0.1"
