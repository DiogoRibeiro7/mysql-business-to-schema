version: '3.8'

# Docker Compose for Web Demo with all database examples

services:
  # Web Demo Application
  web-demo:
    build: .
    container_name: mysql_web_demo
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
      # Database connections (using Docker internal networking)
      DB_HOST: host.docker.internal
      CLINIC_PASSWORD: clinic_root
      IOT_BINS_PASSWORD: iot_root
      ECOMMERCE_PASSWORD: ecommerce_root
      FINTECH_PASSWORD: fintech_root
      SOCIAL_PASSWORD: social_root
      # Rate limiting
      RATE_LIMIT_WINDOW: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      - mysql-clinic
      - mysql-iot
      - mysql-ecommerce
      - mysql-fintech
      - mysql-social
    networks:
      - demo-network

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: mysql_demo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-demo
    networks:
      - demo-network

  # MySQL Databases for Examples
  mysql-clinic:
    image: mysql:8.0
    container_name: mysql_demo_clinic
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: clinic_root
      MYSQL_DATABASE: clinic_db
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: clinic_pass
    ports:
      - "3308:3306"
    volumes:
      - ../example_01_clinic/schema:/docker-entrypoint-initdb.d:ro
      - clinic_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - demo-network

  mysql-iot:
    image: mysql:8.0
    container_name: mysql_demo_iot
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: iot_root
      MYSQL_DATABASE: iot_bins
      MYSQL_USER: iot_user
      MYSQL_PASSWORD: iot_pass
    ports:
      - "3309:3306"
    volumes:
      - ../example_02_iot_bins/schema:/docker-entrypoint-initdb.d:ro
      - iot_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - demo-network

  mysql-ecommerce:
    image: mysql:8.0
    container_name: mysql_demo_ecommerce
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ecommerce_root
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_pass
    ports:
      - "3311:3306"
    volumes:
      - ../example_04_ecommerce/schema:/docker-entrypoint-initdb.d:ro
      - ecommerce_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - demo-network

  mysql-fintech:
    image: mysql:8.0
    container_name: mysql_demo_fintech
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fintech_root
      MYSQL_DATABASE: fintech_db
      MYSQL_USER: fintech_user
      MYSQL_PASSWORD: fintech_pass
    ports:
      - "3317:3306"
    volumes:
      - ../example_10_fintech/schema:/docker-entrypoint-initdb.d:ro
      - fintech_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - demo-network

  mysql-social:
    image: mysql:8.0
    container_name: mysql_demo_social
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: social_root
      MYSQL_DATABASE: social_media_db
      MYSQL_USER: social_user
      MYSQL_PASSWORD: social_pass
    ports:
      - "3318:3306"
    volumes:
      - ../example_11_social_media/schema:/docker-entrypoint-initdb.d:ro
      - social_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - demo-network

  # Data generator service (runs periodically)
  data-generator:
    build:
      context: ../generators
      dockerfile: Dockerfile
    container_name: mysql_demo_generator
    restart: unless-stopped
    environment:
      GENERATION_MODE: demo
      GENERATION_INTERVAL: 3600000 # 1 hour
      MAX_RECORDS: 1000
    depends_on:
      - mysql-clinic
      - mysql-iot
      - mysql-ecommerce
      - mysql-fintech
      - mysql-social
    networks:
      - demo-network
    command: >
      sh -c "
        while true; do
          echo 'Generating sample data...';
          python generate_all.py --mode demo;
          echo 'Sleeping for 1 hour...';
          sleep 3600;
        done
      "

volumes:
  clinic_data:
  iot_data:
  ecommerce_data:
  fintech_data:
  social_data:

networks:
  demo-network:
    name: mysql_demo_network
    driver: bridge